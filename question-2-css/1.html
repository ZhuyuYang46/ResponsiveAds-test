<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Design</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <div class="card-content">
            <h2 class="card-name">Felonious Gru</h2>
            <a href="https://example.com" class="card-link" target="_blank">example.com</a>
        </div>

        <img 
            class="card-avatar" 
            src="wasd.png" 
            alt="Felonious Gru"
        >
    </div>

</body>
</html>
